<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="description" content="Workshop Seu Próximo Passo na Prótese com Cleiton Prata." />
    <title>Seu Próximo Passo na Prótese | Cleiton Prata</title>
    <script>
      (() => {
        const host = window.location.hostname;
        if (host !== 'workshop.cleitonprata.com' && host !== 'cleiton-prata-workshop-rota.vercel.app') return;
        if (window.fbq) return;
        const fbq = function () {
          if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments);
          else fbq.queue.push(arguments);
        };
        window.fbq = window._fbq = fbq;
        fbq.push = fbq;
        fbq.loaded = true;
        fbq.version = '2.0';
        fbq.queue = [];
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.append(script);
        fbq('init', '900263417699788');
        fbq('track', 'PageView');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
